# ===================================================
# DO52 Pro 右手単体（スタンドアロン）用設定
# ===================================================

# 1. 左右の分割（通信）機能を完全に無効化
# これを「n」にすることで、ROLE_CENTRALの競合自体をシステム的に無視させます
CONFIG_ZMK_SPLIT=n

# 2. マウス・トラックポイント機能の強制有効化
# 旧ZMK（Zephyr 3.5.0）で未定義エラーになる「CONFIG_ZMK_POINTING」は削除し、
# 当時の標準である以下の2つのみを有効にします。
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_UROB_COMPAT=n

# 3. 実験的Bluetooth接続を「n」に（Windowsでの即切断バグ回避）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# 4. 電波出力と接続維持の最適化
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30

# 5. スレッドクラッシュ防止用のメモリ拡張
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10

# スリープ設定（15分）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_BATTERY_REPORTING=y

# 分割システムの強制バグを回避するためのダミー定義
CONFIG_ZMK_SPLIT_BLE_NUM_PERIPHERALS=1
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

