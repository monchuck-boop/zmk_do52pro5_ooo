# ===================================================
# DO52 Pro 右手スタンドアロン専用・エラー回避最小構成
# ===================================================

# 1. 通信システムのバグ・矛盾を回避するため、分割関連（SPLIT）の設定は一切書かない
# (シールド側のデフォルト定義にすべて委ねます)

# 2. マウス・トラックポイント機能のみを有効化
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_UROB_COMPAT=n

# 3. Windowsとの即切断バグを回避
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# 4. スタックサイズ（メモリ）の拡張
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048


