#
# 右手側を完全なスタンドアロン（単体キーボード）として動作させる設定
#
# 分割ではないため、CENTRAL定義は不要（またはn）
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# 左右（Split）の分割通信機能を完全に無効化
CONFIG_ZMK_SPLIT=n

#
# Configure PS2 Mouse / Trackpoint Driver Settings
#
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_UROB_COMPAT=n
CONFIG_ZMK_INPUT_ACCELERATOR_LOG_ENABLED=n
CONFIG_CBPRINTF_COMPLETE=n

#
# System Settings
#

# 【修正】Windowsとの即切断バグを回避するため、実験的接続をオフ（n）に
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# 接続パラメータの最適化（スタンドアロン接続の維持用）
CONFIG_ZMK_BLE_THREAD_PRIORITY=3
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30

#
# Logging
#
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_PS2_LOG_LEVEL_DBG=n
CONFIG_UART_LOG_LEVEL_DBG=n
CONFIG_ZMK_RTT_LOGGING=n

CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

# スリープ設定（15分でディープスリープ）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# バッテリー報告
CONFIG_ZMK_BATTERY_REPORTING=y

# Bluetooth送信出力を最大（+8dBm）にして物理的な電波強度を上げる
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# よりノイズや干渉に強い1Mbps通信に固定
CONFIG_BT_CTLR_PHY_2M=n

#
# メモリ（スタックサイズ）の拡張
# トラックポイント＋外部モジュール併用時のスレッドクラッシュを防ぎます
#
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

# 【修正】先頭の # を外してマウス・ポインティング機能を強制有効化
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
