# ===================================================
# DO52 Pro 右手専用：配線を維持したまま親玉（Central）にする設定
# ===================================================

# 1. 右手基板の配線（do52pro_tp_right）のまま、自分がPCと直接話す親玉だと宣言する
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# 2. 【修正済】このZMKバージョンに存在する正しい変数名に修正
# 接続する相手（左手）の数を「0」に固定し、接続待ちループによる切断を防ぎます
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_COUNT=0

# 3. マウス・トラックポイント機能の有効化
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_INPUT_MOUSE_PS2_ENABLE_UROB_COMPAT=n

# 4. Windowsとの即切断バグ（実験的機能）を確実にオフ
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=n

# 5. 電波出力とスタックメモリの拡張
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
